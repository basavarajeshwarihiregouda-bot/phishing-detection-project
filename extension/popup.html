<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhishGuard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="glass-card">
        <header>
            <div class="brand">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                </svg>
                PhishGuard
            </div>
        </header>
        
        <main>
            <div id="url-container" class="url-box">
                <span id="current-url" class="truncate">Scanning URL...</span>
            </div>

            <!-- Loading State -->
            <div id="loading-state" class="state-panel active">
                <div class="spinner"></div>
                <p>Analyzing website security...</p>
            </div>

            <!-- Safe State -->
            <div id="safe-state" class="state-panel hidden">
                <div class="icon-circle safe-bg">
                    <span class="safe-color text-2xl">✅</span>
                </div>
                <h2>Website Appears Safe</h2>
                <p class="desc">No phishing patterns detected.</p>
                <div class="confidence">Confidence: <span id="safe-confidence">--%</span></div>
                <button id="btn-continue" class="btn btn-safe mt-4">Continue Browsing</button>
            </div>

            <!-- Phishing State -->
            <div id="phish-state" class="state-panel hidden">
                <div class="icon-circle phish-bg neon-pulse">
                    <span class="phish-color text-2xl">⚠️</span>
                </div>
                <h2 class="phish-color">Warning</h2>
                <p class="desc text-white">This website may be unsafe and could steal your information.</p>
                <div class="confidence phish-color">Confidence: <span id="phish-confidence">--%</span></div>
                
                <div id="warning-actions" class="actions mt-4 hidden">
                    <button id="btn-close-tab" class="btn btn-ghost">Close Tab</button>
                    <button id="btn-ignore" class="btn btn-phish">Ignore & Visit</button>
                </div>
                <button id="btn-show-warning" class="btn btn-phish mt-4">Visit Site</button>
            </div>
            
            <!-- Error State -->
            <div id="error-state" class="state-panel hidden">
                <div class="icon-circle">
                    <span class="text-2xl">❌</span>
                </div>
                <h2>Connection Error</h2>
                <p class="desc" id="error-text">Could not reach the PhishGuard backend API.</p>
            </div>
        </main>
    </div>

    <script src="popup.js"></script>
</body>
</html>
